%YAML:1.0

#--------------------------------------------------------------------------------------------
# Model Parameters
#--------------------------------------------------------------------------------------------

Model.sh_degree: 3 # maximum
Model.resolution: -1.0
Model.white_background: 0  # 0:false, 1 or other integer:true
Model.eval: 0  # 0:false, 1 or other integer:true

#--------------------------------------------------------------------------------------------
# Pipeline Parameters
#--------------------------------------------------------------------------------------------

Camera.z_near: 0.01
Camera.z_far: 100.0
Monocular.inactive_geo_densify_max_pixel_dist: 1.0 # (squared distance)
Stereo.min_disparity: 8
Stereo.num_disparity: 128
RGBD.min_depth: 0.0000000001
RGBD.max_depth: 40.0

Mapper.inactive_geo_densify: 0  # 0:false, 1 or other integer:true
Mapper.depth_cache: 10
Mapper.min_num_initial_map_kfs: 10
Mapper.new_keyframe_times_of_use: 5 # 2
Mapper.local_BA_increased_times_of_use: 0
Mapper.loop_closure_increased_times_of_use_: 2
Mapper.cull_keyframes: 0  # 0:false, 1 or other integer:true
Mapper.large_rotation_threshold: 30.0
Mapper.large_translation_threshold: 1.0
Mapper.stable_num_iter_existence: 1

GausPyramid.do: 0  # 0:false, 1 or other integer:true
GausPyramid.num_sub_levels: 2
GausPyramid.sub_level_times_of_use: 8

Pipeline.convert_SHs: 0  # 0:false, 1 or other integer:true
Pipeline.compute_cov3D: 0  # 0:false, 1 or other integer:true

Record.keyframe_record_interval: 0 # 0:never, 1:always, others:periodically
Record.all_keyframes_record_interval: 0 # 0:never, 1:always, others:periodically
Record.record_rendered_image: 1 # 0:false, 1 or other integer:true
Record.record_rendered_opacity: 1 # 0:false, 1 or other integer:true
Record.record_rendered_depth: 1 # 0:false, 1 or other integer:true
Record.record_rendered_depth_vis: 1 # 0:false, 1 or other integer:true; normalize to 255, or in real scales
Record.record_ground_truth_image: 0 # 0:false, 1 or other integer:true
Record.record_loss_image: 1 # 0:false, 1 or other integer:true
Record.training_report_interval: 0 # 0:never, 1:always, others:periodically
Record.record_loop_ply: 0 # 0:false, 1 or other integer:true

#--------------------------------------------------------------------------------------------
# Optimization Parameters
#--------------------------------------------------------------------------------------------

# Learning rate
Optimization.max_num_iterations: 30100
Optimization.position_lr_init: 0.00032 #0.00016
Optimization.position_lr_final: 0.00032
Optimization.position_lr_delay_mult: 0.01
Optimization.position_lr_max_steps: 24
Optimization.feature_lr: 0.0025
Optimization.opacity_lr: 0.05 #0.05
Optimization.scaling_lr: 0.005 #0.005
Optimization.rotation_lr: 0.001 #0.001

# Densification
Optimization.percent_dense: 0.01
Optimization.lambda_dssim: 0.2
Optimization.densification_interval: 100
Optimization.opacity_reset_interval: 0  # 0:never, 1:always, others:periodically
Optimization.prune_big_point_after_iter: 30000
Optimization.densify_min_opacity: 0.1 #0.005
Optimization.densify_from_iter: 1000
Optimization.densify_until_iter: 30000
Optimization.densify_grad_threshold: 0.001

# Alignment
Optimization.init_train_iter: 0
Optimization.global_align_lr_iter: 40
Optimization.global_align_hr_iter: 50
Optimization.global_align_hr_warmup_iter: 10
Optimization.global_align_hr_resize_ratio: 1.0
Optimization.global_align_time_window_ratio: 1.5
Optimization.global_align_opcacity_thr: 0.94
Optimization.dense_map_points: 1 # 0: false, 1: true
Optimization.dense_sample_num: 1000.0
Optimization.dense_diff_threshold: 0.0 # 0.0: disable, other: enable
Optimization.dense_diff_threshold_ratio: 1.75

#--------------------------------------------------------------------------------------------
# Keyframe Optimization Parameters
#--------------------------------------------------------------------------------------------

KeyframeOptimization.debug: 1
KeyframeOptimization.debug_dir: "_debug"
KeyframeOptimization.align_pose: 1 # 0: false, 1: true
KeyframeOptimization.render_aligned: 1 # 0: false, 1: true
KeyframeOptimization.align_global_pose: 1 # 0: false, 1: true
KeyframeOptimization.align_local_pose: 1 # 0: false, 1: true
KeyframeOptimization.theta_lr: 0.007 #0.0046
KeyframeOptimization.rho_lr: 0.0036 #0.0026
KeyframeOptimization.hr_width: 960
KeyframeOptimization.hr_height: 480
KeyframeOptimization.hr_fps: 30.0
KeyframeOptimization.hr_fx: 1333.333333
KeyframeOptimization.hr_fy: 1333.333333
KeyframeOptimization.hr_cx: 480.0
KeyframeOptimization.hr_cy: 240.0
KeyframeOptimization.hr_k1: 0.0
KeyframeOptimization.hr_k2: 0.0
KeyframeOptimization.hr_p1: 0.0
KeyframeOptimization.hr_p2: 0.0
KeyframeOptimization.hr_k3: 0.0

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------

GaussianViewer.glfw_window_width: 1400
GaussianViewer.glfw_window_height: 1050
GaussianViewer.image_scale: 0.5
GaussianViewer.image_scale_main: 1.0
GaussianViewer.camera_watch_dist: 0.000001
